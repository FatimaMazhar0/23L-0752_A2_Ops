name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install dependencies
        run: pip install -r requirements-docker.txt pytest ruff

      - name: Lint
        run: ruff check visionguard tests

      - name: Test
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t visionguard:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name vg -p 8000:8000 visionguard:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 5
          done
          docker logs vg
          exit 1
