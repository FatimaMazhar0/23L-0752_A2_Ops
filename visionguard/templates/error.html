{% extends "base.html" %}
{% block title %}Error {{ code }} &middot; VisionGuard{% endblock %}
{% block content %}
<div class="card error">
  <p class="muted">Error {{ code }}</p>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <p><a class="button" href="{{ url_for('index') }}">Back to upload</a></p>
</div>
{% endblock %}
